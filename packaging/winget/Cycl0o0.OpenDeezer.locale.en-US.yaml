ShortDescription: Terminal Deezer client — browse, stream (Free or HiFi) and download with your ARL.
Description: >-
  OpenDeezer is a terminal Deezer client (with native GUIs) that streams your
  Deezer library. Log in via the embedded web view, browse liked songs,
  playlists, charts, artists and podcasts, Flow, synced lyrics, and manage your
  library. Free accounts stream the full library at 128 kbps (ad-supported); a
  paid plan unlocks higher quality (up to HiFi FLAC) and downloading tracks to disk.
