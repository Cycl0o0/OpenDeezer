name: opendeezer
title: OpenDeezer
version: "3.1.4"
summary: Open-source desktop client for Deezer
description: |
  OpenDeezer is an unofficial, open-source client for browsing and streaming
  music from a Deezer account. This package uses the native GTK4/libadwaita
  desktop interface and stores its credentials in the snap's private data
  directory.

  OpenDeezer is not affiliated with or endorsed by Deezer.
license: AGPL-3.0-only
website: https://github.com/Cycl0o0/OpenDeezer
source-code: https://github.com/Cycl0o0/OpenDeezer
issues: https://github.com/Cycl0o0/OpenDeezer/issues
icon: assets/icon.png

base: core24
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:
  arm64:

# WebKitGTK 6.0 launches its network and web processes from this absolute path.
# The GNOME extension supplies equivalent layouts only for WebKit 4.0/4.1.
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkitgtk-6.0:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkitgtk-6.0

slots:
  mpris:
    interface: mpris
    name: opendeezer

apps:
  opendeezer:
    command: usr/bin/opendeezer-gnome
    common-id: org.opendeezer.OpenDeezer
    desktop: usr/share/applications/org.opendeezer.OpenDeezer.desktop
    extensions:
      - gnome
    environment:
      XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
      XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
    plugs:
      - audio-playback
      - home
      - network
      - network-bind
    slots:
      - mpris

parts:
  # Build snaps are unavailable inside Canonical's OCI image. Stage the exact
  # upstream toolchain instead, verify it before use, and omit it from the final
  # snap. Keep these hashes in sync with https://go.dev/dl/?mode=json&include=all.
  go-toolchain:
    plugin: nil
    build-packages:
      - ca-certificates
      - curl
    override-pull: |
      set -eux
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          GO_SHA256=234828b7a89e0e303d2556310ee549fbcf253d28de937bac3da13d6294262ac1
          ;;
        arm64)
          GO_SHA256=8b5884aef89600aef5b0b051fb971f11f49bb996521e911f30f02a66884f7bd2
          ;;
        *)
          echo "unsupported Snap build architecture: $CRAFT_ARCH_BUILD_FOR" >&2
          exit 1
          ;;
      esac
      mkdir -p "$CRAFT_PART_SRC"
      curl --fail --location --retry 3 \
        "https://go.dev/dl/go1.25.12.linux-${CRAFT_ARCH_BUILD_FOR}.tar.gz" \
        --output "$CRAFT_PART_SRC/go.tar.gz"
      echo "$GO_SHA256  $CRAFT_PART_SRC/go.tar.gz" | sha256sum --check --strict
    override-build: |
      set -eux
      tar -xzf "$CRAFT_PART_SRC/go.tar.gz" -C "$CRAFT_PART_INSTALL"
    prime:
      - "-*"

  opendeezer:
    plugin: nil
    source: .
    after:
      - go-toolchain
    build-packages:
      - build-essential
      - gettext
      - libadwaita-1-dev
      - libasound2-dev
      - libgtk-4-dev
      - libjson-glib-dev
      - libsoup-3.0-dev
      - libwebkitgtk-6.0-dev
      - meson
      - ninja-build
      - pkg-config
    stage-packages:
      - ca-certificates
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - libasound2-data
      - libasound2-plugins
      - libasound2t64
      - libjson-glib-1.0-0
      - libsoup-3.0-0
      - libwebkitgtk-6.0-4
    override-build: |
      set -eux
      cd "$CRAFT_PART_SRC"
      export PATH="$CRAFT_STAGE/go/bin:$PATH"
      test "$(go env GOVERSION)" = go1.25.12

      mkdir -p gui/gnome/lib
      CGO_ENABLED=1 go build \
        -mod=readonly \
        -trimpath \
        -buildmode=c-archive \
        -o gui/gnome/lib/libdeezercore.a \
        ./corelib

      meson setup \
        "$CRAFT_PART_BUILD/gnome-build" \
        gui/gnome \
        --buildtype=release \
        --prefix=/usr
      meson compile -C "$CRAFT_PART_BUILD/gnome-build"
      DESTDIR="$CRAFT_PART_INSTALL" \
        meson install -C "$CRAFT_PART_BUILD/gnome-build"
