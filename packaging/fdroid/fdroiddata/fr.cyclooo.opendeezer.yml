AutoName: OpenDeezer

RepoType: git
Repo: https://github.com/Cycl0o0/OpenDeezer.git
Binaries: https://github.com/Cycl0o0/OpenDeezer/releases/download/v%v/OpenDeezer-android-fdroid-%v-%c.apk

Builds:
  - versionName: 3.1.4
    versionCode: 261
    commit: 19b49585516d1ec2efc04a6d94ee40ddf92368dd
    subdir: gui/android/app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc6-dev
      - apt-get install -y -t trixie-backports golang-go
    gradle:
      - mobile
    srclibs:
      - go@go1.25.12
    rm:
      - gui/macos/Clib/libdeezercore-amd64.a
      - gui/macos/Clib/libdeezercore-arm64.a
    prebuild: sdkmanager 'platforms;android-24' 'platforms;android-34'
      'build-tools;34.0.0'
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH=$(pwd)/.fdroid-gopath
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - cd ../../..
      - scripts/build-mobile-tools.sh "$GOPATH/bin"
      - gomobile bind -trimpath -target=android -androidapi 24 -bootclasspath
        "$ANDROID_HOME/platforms/android-34/android.jar" -ldflags="-s -w
        -buildid=" -o gui/android/app/libs/odmobile.aar ./mobile
    ndk: r26d
    gradleprops:
      - upstreamUpdates=false
      - fdroidAbi=armeabi-v7a

