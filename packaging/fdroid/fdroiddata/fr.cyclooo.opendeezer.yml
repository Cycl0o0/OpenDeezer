AntiFeatures:
  NonFreeNet:
    en-US: The app depends on Deezer, a proprietary network service.
  TetheredNet:
    en-US: A Deezer account is required and the service endpoint is not configurable.
  Tracking:
    en-US: Playback events are reported to Deezer for listening and free-tier accounting.
