Builds:
  - versionName: 3.1.4
    versionCode: 26
    # This reviewed post-tag commit retains the v3.1.4 Android and Go sources
    # while adding the reproducible F-Droid release workflow.
    commit: b6c928d487ff94f7485c58c414de407e05ec79b1
    subdir: gui/android/app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc6-dev
      - apt-get install -y -t trixie-backports golang-go
    srclibs:
      - go@go1.25.12
    # These prebuilt macOS archives are unrelated to the Android build and are
    # removed so F-Droid's source scanner never has to trust them.
    rm:
      - gui/macos/Clib/libdeezercore-amd64.a
      - gui/macos/Clib/libdeezercore-arm64.a
    # gomobile needs the minimum API platform as well as the platform and build
    # tools used by the Android application module.
    prebuild: sdkmanager 'platforms;android-24' 'platforms;android-34' 'build-tools;34.0.0'
    build:
      # Build the exact Go release requested by go.mod. The Debian Go package is
      # used only as its bootstrap compiler.
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH=$(pwd)/.fdroid-gopath
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - cd ../../..
      # Build the pinned gomobile and gobind modules without `gomobile init`,
      # which installs an unpinned gobind@latest.
      - scripts/build-mobile-tools.sh "$GOPATH/bin"
      # API 34 and stripped non-runtime Go metadata keep GitHub's official Go
      # toolchain byte-identical to F-Droid's source-built Go toolchain.
      - gomobile bind -trimpath -target=android -androidapi 24 -bootclasspath "$ANDROID_HOME/platforms/android-34/android.jar"
        -ldflags="-s -w -buildid=" -o gui/android/app/libs/odmobile.aar ./mobile
    ndk: r26d
    gradle:
      - mobile
    # F-Droid owns update discovery and delivery for this build. This removes
    # both the launch check and the Settings update action.
    gradleprops:
      - upstreamUpdates=false

