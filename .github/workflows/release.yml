name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # allow manual runs (artifacts attach only on tag pushes)

permissions:
  contents: write

jobs:
  # Which GUI frontends are present in the tree — lets jobs skip cleanly until a
  # frontend (e.g. gui/windows) is committed.
  detect:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.c.outputs.macos }}
      gnome: ${{ steps.c.outputs.gnome }}
      kde: ${{ steps.c.outputs.kde }}
      windows: ${{ steps.c.outputs.windows }}
      linux: ${{ steps.c.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
      - id: c
        run: |
          for d in macos gnome kde windows linux; do
            if [ -d "gui/$d" ]; then echo "$d=true" >> "$GITHUB_OUTPUT"; else echo "$d=false" >> "$GITHUB_OUTPUT"; fi
          done

  # ---- Terminal client (TUI) ----
  # The audio engine uses malgo (miniaudio), which needs cgo on every platform,
  # so all targets build with CGO_ENABLED=1 (was pure-Go under oto). darwin/amd64
  # is cross-built on the arm64 macOS runner via clang -arch x86_64; Windows uses
  # mingw gcc.
  tui:
    name: tui ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-24.04,     cgo: 1 }
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04-arm, cgo: 1 }
          - { goos: darwin,  goarch: arm64, runner: macos-latest,     cgo: 1 }
          - { goos: darwin,  goarch: amd64, runner: macos-latest,     cgo: 1 }
          - { goos: windows, goarch: amd64, runner: windows-latest,   cgo: 1 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: Install ALSA (linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
          OUT="opendeezer-tui-${GOOS}-${GOARCH}${EXT}"
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          if [ "$GOOS" = darwin ] && [ "$GOARCH" = amd64 ]; then
            export CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64"
          fi
          if [ "$GOOS" = windows ]; then
            # MinGW-w64 is preinstalled on windows-latest (same as the GUI job).
            export CC=x86_64-w64-mingw32-gcc
            LDFLAGS="$LDFLAGS -extldflags=-static"
          fi
          go build -trimpath -ldflags "$LDFLAGS" -o "$OUT" ./cmd/opendeezer
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          fail_on_unmatched_files: true
      - name: Attest build provenance (tui binary)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: '${{ env.ARTIFACT }}'

  # ---- macOS GUI (SwiftUI / Liquid Glass) ----
  # Liquid Glass needs the macOS 26 / Xcode 26 SDK (.glassEffect etc. live in
  # SwiftUICore 26), so this requires the macos-26 runner image. That image is
  # rolling out (actions/runner-images#13739) and may be missing or buggy on a
  # given account/region, so keep the job non-blocking until it's GA — a failure
  # here must not fail the release (the TUI darwin matrix is cgo-free + unaffected).
  macos-app:
    needs: detect
    if: needs.detect.outputs.macos == 'true'
    runs-on: macos-26
    continue-on-error: true
    # SIGN is 'true' only when the Developer ID + notarization secrets are all
    # present, so forks / secret-less runs still build (an unsigned zip, exactly
    # as before) instead of failing. When true, the app is Developer ID signed,
    # notarized and stapled so Gatekeeper opens it with no prompt or quarantine.
    env:
      SIGN: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: Build universal app bundle (arm64 + x86_64)
        run: cd gui/macos && make app

      # ---- code signing + notarization (see docs/MACOS_SIGNING.md) ----
      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Put the temp keychain on the search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign app (Developer ID, hardened runtime)
        if: env.SIGN == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          cd gui/macos
          # Sign inside-out: the nested Mach-O executable first, then seal the
          # bundle. Hardened runtime (--options runtime) is required to notarize.
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" OpenDeezer.app/Contents/MacOS/OpenDeezer
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" OpenDeezer.app
          codesign --verify --strict --verbose=2 OpenDeezer.app

      - name: Zip
        run: cd gui/macos && ditto -c -k --keepParent OpenDeezer.app ../../OpenDeezer-macos-universal.zip

      - name: Notarize and staple
        if: env.SIGN == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          # --wait blocks until Apple returns Accepted/Invalid; a non-Accepted
          # status exits non-zero and fails the (non-blocking) job, so a broken
          # build never uploads.
          xcrun notarytool submit OpenDeezer-macos-universal.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
            --wait
          # Staple the ticket into the .app, then re-zip so the offline ticket ships.
          xcrun stapler staple gui/macos/OpenDeezer.app
          xcrun stapler validate gui/macos/OpenDeezer.app
          rm -f OpenDeezer-macos-universal.zip
          cd gui/macos && ditto -c -k --keepParent OpenDeezer.app ../../OpenDeezer-macos-universal.zip
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-macos-universal.zip

  # ---- GNOME GUI (GTK4 / libadwaita) — needs ubuntu-24.04 (libadwaita >= 1.5) ----
  gnome:
    needs: detect
    if: needs.detect.outputs.gnome == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libjson-glib-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libasound2-dev meson ninja-build gettext
      - name: Build
        run: cd gui/gnome && chmod +x build.sh && ./build.sh
      - name: Stage artifact
        run: cp gui/gnome/opendeezer-gnome OpenDeezer-gnome-${{ matrix.arch }}
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-gnome-${{ matrix.arch }}

  # ---- KDE GUI (Qt6 Widgets) ----
  kde:
    needs: detect
    if: needs.detect.outputs.kde == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-webengine-dev qt6-l10n-tools qt6-tools-dev cmake libasound2-dev
      - name: Build
        run: cd gui/kde && chmod +x build.sh && ./build.sh
      - name: Stage artifact
        run: cp gui/kde/opendeezer-kde OpenDeezer-kde-${{ matrix.arch }}
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-kde-${{ matrix.arch }}

  # ---- Unified Linux client (GTK + Qt backends behind a dlopen launcher) ----
  linux-unified:
    needs: detect
    if: needs.detect.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libjson-glib-dev libwebkitgtk-6.0-dev libsoup-3.0-dev qt6-base-dev qt6-webengine-dev qt6-l10n-tools qt6-tools-dev libasound2-dev meson ninja-build cmake gettext
      - name: Build unified bundle
        run: cd gui/linux && chmod +x build.sh && ./build.sh
      - name: Package
        run: tar -C gui/linux/dist -czf OpenDeezer-linux-${{ matrix.arch }}.tar.gz .
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-linux-${{ matrix.arch }}.tar.gz

  # ---- Windows GUI (C# WinUI 3 / .NET 8) — needs .NET SDK + MinGW (Go DLL) ----
  windows-gui:
    needs: detect
    if: needs.detect.outputs.windows == 'true'
    runs-on: windows-latest
    # SIGN is 'true' only when the Azure Trusted Signing secrets are present, so
    # forks / secret-less runs still zip an unsigned build exactly as before. When
    # true, OpenDeezer.exe is Authenticode-signed so SmartScreen stops flagging an
    # "unknown publisher". See docs/WINDOWS_SIGNING.md.
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.TRUSTED_SIGNING_ACCOUNT_NAME != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build (Go c-shared DLL + dotnet publish)
        shell: pwsh
        run: cd gui/windows; ./build.ps1
      - name: Locate publish dir
        id: pub
        shell: pwsh
        # build.ps1 publishes a self-contained win-x64 build (exe + WinAppSDK DLLs +
        # libdeezercore.dll) under bin\...\win-x64\publish. Resolve that dir robustly.
        run: |
          $exe = Get-ChildItem -Path gui/windows/bin -Filter OpenDeezer.exe -Recurse -File |
                 Where-Object { $_.FullName -match '\\publish\\' } | Select-Object -First 1
          if (-not $exe) { throw 'publish dir not found' }
          "dir=$($exe.Directory.FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign OpenDeezer.exe (Azure Trusted Signing)
        if: env.SIGN == 'true'
        # Signs only the launcher exe (SmartScreen assesses the exe the user runs;
        # the WinAppSDK DLLs are already Microsoft-signed and libdeezercore.dll is
        # loaded by the signed exe, so re-signing every DLL is unnecessary).
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: ${{ steps.pub.outputs.dir }}
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path (Join-Path '${{ steps.pub.outputs.dir }}' '*') -DestinationPath OpenDeezer-windows-x64.zip
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-windows-x64.zip

  # ---- Android app (Kotlin/Compose via gomobile AAR) ----
  android:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Android release version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Android releases require a stable semver tag (vX.Y.Z)"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' gui/android/app/build.gradle.kts | head -1)
          if [ "$GRADLE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match Android versionName $GRADLE_VERSION"
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # "tools" (default) drags in an Android Emulator update we never
          # use and whose download flakes; platform-tools is all we need.
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
      - name: Build odmobile.aar (gomobile)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          scripts/build-mobile-tools.sh "$RUNNER_TEMP/opendeezer-mobile-tools"
          export PATH="$RUNNER_TEMP/opendeezer-mobile-tools:$PATH"
          mkdir -p gui/android/app/libs
          gomobile bind -trimpath -target=android -androidapi 24 -o gui/android/app/libs/odmobile.aar ./mobile
      - name: Require Android release-signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Android release secret $name is not configured"
              exit 1
            fi
          done

      - name: Assemble release APKs (signed, phone + TV)
        working-directory: gui/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/opendeezer-release.p12
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod +x ./gradlew || true
          ./gradlew --no-daemon -PupstreamUpdates=true -PabiSplits=true \
            assembleMobileRelease assembleTvRelease
      # Prove the signed APKs satisfy Google's sideload developer-verification
      # policy: they must carry an APK Signature Scheme v2/v3 block whose
      # certificate is the registered developer key. This verifies both APKs and
      # fails the release if the signing certificate does not match the expected
      # fingerprint (defaults to the registered key; override with the repo
      # variable ANDROID_EXPECTED_CERT_SHA256 if the key is ever rotated).
      - name: Verify release signatures (Google sideload compliance)
        env:
          ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          EXPECTED="${ANDROID_EXPECTED_CERT_SHA256:-E5:C1:14:BA:5E:F3:48:2B:5A:44:14:85:92:38:35:C5:10:C7:24:01:3F:41:16:C9:A4:48:08:B3:47:DF:A2:30}"
          WANT=$(echo "$EXPECTED" | tr -d ' :' | tr 'a-f' 'A-F')
          verify_one() {
            local apk="$1"
            echo "== $apk =="
            local verification got
            verification=$("$APKSIGNER" verify --print-certs --verbose "$apk")
            echo "$verification"
            # Require v2 and v3 blocks, not just the legacy v1 jar signature.
            for scheme in v2 v3; do
              echo "$verification" | grep -q "Verified using $scheme scheme (APK Signature Scheme $scheme): true" \
                || { echo "::error::$apk is not signed with APK Signature Scheme $scheme"; exit 1; }
            done
            got=$(echo "$verification" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ' :' | tr 'a-f' 'A-F')
            echo "signing cert SHA-256: $got"
            if [ "$got" != "$WANT" ]; then
              echo "::error::$apk signing cert ($got) does not match the registered developer key ($WANT)"; exit 1
            fi
            echo "matches the registered developer key ✓"
          }
          for apk in gui/android/app/build/outputs/apk/mobile/release/*.apk \
                     gui/android/app/build/outputs/apk/tv/release/*.apk; do
            verify_one "$apk"
          done
      - name: Stage release artifacts
        run: |
          mobile=gui/android/app/build/outputs/apk/mobile/release
          tv=gui/android/app/build/outputs/apk/tv/release
          cp "$mobile/app-mobile-universal-release.apk" OpenDeezer-android.apk
          cp "$tv/app-tv-universal-release.apk" OpenDeezer-androidtv.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            cp "$mobile/app-mobile-${abi}-release.apk" "OpenDeezer-android-${abi}.apk"
            cp "$tv/app-tv-${abi}-release.apk" "OpenDeezer-androidtv-${abi}.apk"
          done

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenDeezer-android*.apk
          fail_on_unmatched_files: true

  # ---- iOS app (SwiftUI via gomobile xcframework) — unsigned .ipa for sideloading ----
  # No Apple Developer account, so we ship an UNSIGNED device build: sideload with
  # AltStore / Sideloadly (they re-sign with your own Apple ID), or open the Xcode
  # project, set a Team, and run. Non-blocking: hosted-runner iOS toolchains vary.
  ios:
    if: startsWith(github.ref, 'refs/tags/')
    # Liquid Glass (glassEffect / .glassProminent / tabViewBottomAccessory) needs
    # the iOS 26 SDK, so build with Xcode 26 on the macos-26 image (same as the
    # macOS app job). macos-15/Xcode 16 = iOS 18 SDK = compile errors.
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Install the iOS platform for this Xcode
        # macos-26 ships Xcode 26 without the iOS platform support files, so
        # even a device build ('generic/platform=iOS') fails with
        # "iOS 26.0 is not installed". Fetch it first — but `-downloadPlatform iOS`
        # flakes on the fresh image with "Unable to connect to simulator" (exit 70),
        # so skip when the SDK is already present, prime the toolchain, and retry.
        run: |
          set +e
          # The macos-26 image ships the iOS 26 *SDK* but NOT the installed iOS
          # *platform* a device build (generic/platform=iOS) needs; -showsdks listing
          # iphoneos26 is not enough. Install it with -downloadPlatform, which flakes
          # with "Unable to connect to simulator" (exit 70) until CoreSimulator is
          # bounced — so prime the toolchain, bounce the service, then download.
          bounce() {
            sudo launchctl stop com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null
            sudo pkill -9 -f CoreSimulator 2>/dev/null
            xcrun simctl list >/dev/null 2>&1
          }
          sudo xcodebuild -runFirstLaunch || true
          ok=0
          for i in 1 2 3 4; do
            bounce
            xcodebuild -downloadPlatform iOS && { ok=1; break; }
            echo "downloadPlatform attempt $i failed; retrying in $((i*15))s"
            sleep $((i*15))
          done
          # Fallback: fetch every platform (also installs iOS) if the targeted call
          # never succeeded.
          [ "$ok" -eq 1 ] || { bounce; xcodebuild -downloadAllPlatforms; }
          echo "== installed iOS SDKs =="; xcodebuild -showsdks 2>/dev/null | grep -i iphoneos || true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: Build Odmobile.xcframework (gomobile bind ios)
        run: |
          scripts/build-mobile-tools.sh "$RUNNER_TEMP/opendeezer-mobile-tools"
          export PATH="$RUNNER_TEMP/opendeezer-mobile-tools:$PATH"
          gomobile bind -trimpath -target=ios -o gui/ios/Odmobile.xcframework ./mobile
      - name: Generate Xcode project (xcodegen)
        run: |
          brew install xcodegen
          cd gui/ios && xcodegen generate
      - name: Build unsigned device app
        run: |
          cd gui/ios
          # Use an explicit generic iOS destination — '-sdk iphoneos' alone
          # intermittently fails with "Found no destinations for the scheme".
          xcodebuild -project OpenDeezer.xcodeproj -scheme OpenDeezer \
            -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned .ipa
        run: |
          cd gui/ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OpenDeezer.app Payload/
          zip -qry ../../OpenDeezer-ios-unsigned.ipa Payload
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-ios-unsigned.ipa

  # ---- Checksums: gather every released asset and publish SHA256SUMS.txt ----
  # macOS and iOS are intentionally best-effort (`continue-on-error` above), so
  # their assets are hashed when present but do not block checksums/manifests.
  checksums:
    needs: [detect, tui, macos-app, gnome, kde, linux-unified, windows-gui, android, ios]
    if: >-
      startsWith(github.ref, 'refs/tags/') && always() &&
      needs.detect.result == 'success' &&
      needs.tui.result == 'success' && needs.android.result == 'success' &&
      (needs.detect.outputs.gnome != 'true' || needs.gnome.result == 'success') &&
      (needs.detect.outputs.kde != 'true' || needs.kde.result == 'success') &&
      (needs.detect.outputs.linux != 'true' || needs['linux-unified'].result == 'success') &&
      (needs.detect.outputs.windows != 'true' || needs['windows-gui'].result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist && cd dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
      - name: Extract release notes section from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Capture the section starting at ## [TAG] until the next ## [ or EOF.
          # This becomes the GitHub Release body.
          awk -v tag="## \\[${TAG}\\]" '
            $0 ~ tag { insec=1; print; next }
            insec && /^## \[/ { insec=0; exit }
            insec { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No dedicated section found for tag v${TAG} in CHANGELOG.md." > RELEASE_NOTES.md
          fi
          echo "=== RELEASE NOTES ==="
          cat RELEASE_NOTES.md
      - name: Generate SHA256SUMS
        env:
          HAS_GNOME: ${{ needs.detect.outputs.gnome }}
          HAS_KDE: ${{ needs.detect.outputs.kde }}
          HAS_LINUX: ${{ needs.detect.outputs.linux }}
          HAS_WINDOWS: ${{ needs.detect.outputs.windows }}
        run: |
          # On re-runs the download above includes the previously published
          # SHA256SUMS.txt — drop it so the sums file never references itself.
          rm -f dist/SHA256SUMS.txt
          required=( \
            opendeezer-tui-darwin-arm64 \
            opendeezer-tui-darwin-amd64 \
            opendeezer-tui-linux-arm64 \
            opendeezer-tui-linux-amd64 \
            opendeezer-tui-windows-amd64.exe \
            OpenDeezer-android.apk \
            OpenDeezer-androidtv.apk \
            OpenDeezer-android-armeabi-v7a.apk \
            OpenDeezer-android-arm64-v8a.apk \
            OpenDeezer-android-x86.apk \
            OpenDeezer-android-x86_64.apk \
            OpenDeezer-androidtv-armeabi-v7a.apk \
            OpenDeezer-androidtv-arm64-v8a.apk \
            OpenDeezer-androidtv-x86.apk \
            OpenDeezer-androidtv-x86_64.apk \
          )
          if [ "$HAS_GNOME" = true ]; then
            required+=(OpenDeezer-gnome-x86_64 OpenDeezer-gnome-aarch64)
          fi
          if [ "$HAS_KDE" = true ]; then
            required+=(OpenDeezer-kde-x86_64 OpenDeezer-kde-aarch64)
          fi
          if [ "$HAS_LINUX" = true ]; then
            required+=(OpenDeezer-linux-x86_64.tar.gz OpenDeezer-linux-aarch64.tar.gz)
          fi
          if [ "$HAS_WINDOWS" = true ]; then
            required+=(OpenDeezer-windows-x64.zip)
          fi
          for asset in "${required[@]}"; do
            test -f "dist/$asset" || {
              echo "::error::Required release asset is missing: $asset"
              exit 1
            }
          done
          (cd dist && sha256sum -- *) > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
      - name: Attest build provenance (checksums)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'SHA256SUMS.txt'

  # ---- Packaging manifest automation: update shas + versions, open PR ----
  # (Follow-up external pushes to homebrew-tap / AUR / winget-pkgs documented in
  # packaging/README.md; no secrets for them are present here.)
  publish-manifests:
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # create-pull-request configures its own token. Keeping checkout's
          # credential too sends duplicate Authorization headers on git fetch.
          persist-credentials: false
      - name: Download SHA256SUMS.txt from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS.txt --output SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Extract checksums
        id: sums
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> $GITHUB_OUTPUT
      - name: Hash the tagged source archive
        id: source
        run: |
          VERSION="${{ steps.sums.outputs.version }}"
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz" \
            --output source.tar.gz
          echo "sha256=$(sha256sum source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Update package manifests
        run: |
          scripts/update-package-manifests.sh \
            "${{ steps.sums.outputs.version }}" \
            SHA256SUMS.txt \
            "${{ steps.source.outputs.sha256 }}"
      - name: Preserve updated manifests
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests-${{ github.ref_name }}
          path: |
            packaging/aur/
            packaging/fdroid/
            packaging/homebrew/
            packaging/scoop/
            packaging/snap/
            packaging/winget/
          include-hidden-files: true
      - name: Open PR with updated manifests
        id: packaging_pr
        # Some repositories disable PR creation by GITHUB_TOKEN. The validated
        # manifests remain available as the artifact above if that setting is off.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "chore(release): update packaging manifests for ${{ github.ref_name }}"
          branch: release/manifests-${{ github.ref_name }}
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            packaging/**
          title: "chore(release): update manifests for ${{ github.ref_name }}"
          body: |
            Automated update from release ${{ github.ref_name }}.

            - Bumped versions
            - Injected real checksums into Homebrew, winget, AUR, and Scoop manifests
            - Updated Snap and F-Droid candidate versions
            - (External follow-ups to taps/AUR/winget-pkgs are manual or use separate secrets; see packaging/README.md)
          labels: |
            release
            automated
      - name: Report disabled manifest PR creation
        if: steps.packaging_pr.outcome == 'failure'
        run: |
          echo "::warning::Could not open the package-manifest PR. Download the package-manifests-${GITHUB_REF_NAME} workflow artifact, or enable Actions PR creation."
