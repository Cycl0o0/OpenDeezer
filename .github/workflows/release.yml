name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # allow manual runs (artifacts attach only on tag pushes)

permissions:
  contents: write

jobs:
  # Which GUI frontends are present in the tree — lets jobs skip cleanly until a
  # frontend (e.g. gui/windows) is committed.
  detect:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.c.outputs.macos }}
      gnome: ${{ steps.c.outputs.gnome }}
      kde: ${{ steps.c.outputs.kde }}
      windows: ${{ steps.c.outputs.windows }}
      linux: ${{ steps.c.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          for d in macos gnome kde windows linux; do
            if [ -d "gui/$d" ]; then echo "$d=true" >> "$GITHUB_OUTPUT"; else echo "$d=false" >> "$GITHUB_OUTPUT"; fi
          done

  # ---- Terminal client (TUI) ----
  # The audio engine uses malgo (miniaudio), which needs cgo on every platform,
  # so all targets build with CGO_ENABLED=1 (was pure-Go under oto). darwin/amd64
  # is cross-built on the arm64 macOS runner via clang -arch x86_64; Windows uses
  # mingw gcc.
  tui:
    name: tui ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-24.04,     cgo: 1 }
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04-arm, cgo: 1 }
          - { goos: darwin,  goarch: arm64, runner: macos-latest,     cgo: 1 }
          - { goos: darwin,  goarch: amd64, runner: macos-latest,     cgo: 1 }
          - { goos: windows, goarch: amd64, runner: windows-latest,   cgo: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Install ALSA (linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
          OUT="opendeezer-tui-${GOOS}-${GOARCH}${EXT}"
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          if [ "$GOOS" = darwin ] && [ "$GOARCH" = amd64 ]; then
            export CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64"
          fi
          if [ "$GOOS" = windows ]; then
            # MinGW-w64 is preinstalled on windows-latest (same as the GUI job).
            export CC=x86_64-w64-mingw32-gcc
            LDFLAGS="$LDFLAGS -extldflags=-static"
          fi
          go build -ldflags "$LDFLAGS" -o "$OUT" ./cmd/opendeezer
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          fail_on_unmatched_files: true

  # ---- macOS GUI (SwiftUI / Liquid Glass) ----
  # Liquid Glass needs the macOS 26 / Xcode 26 SDK (.glassEffect etc. live in
  # SwiftUICore 26), so this requires the macos-26 runner image. That image is
  # rolling out (actions/runner-images#13739) and may be missing or buggy on a
  # given account/region, so keep the job non-blocking until it's GA — a failure
  # here must not fail the release (the TUI darwin matrix is cgo-free + unaffected).
  macos-app:
    needs: detect
    if: needs.detect.outputs.macos == 'true'
    runs-on: macos-26
    continue-on-error: true
    # SIGN is 'true' only when the Developer ID + notarization secrets are all
    # present, so forks / secret-less runs still build (an unsigned zip, exactly
    # as before) instead of failing. When true, the app is Developer ID signed,
    # notarized and stapled so Gatekeeper opens it with no prompt or quarantine.
    env:
      SIGN: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Build universal app bundle (arm64 + x86_64)
        run: cd gui/macos && make app

      # ---- code signing + notarization (see docs/MACOS_SIGNING.md) ----
      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Put the temp keychain on the search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign app (Developer ID, hardened runtime)
        if: env.SIGN == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          cd gui/macos
          # Sign inside-out: the nested Mach-O executable first, then seal the
          # bundle. Hardened runtime (--options runtime) is required to notarize.
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" OpenDeezer.app/Contents/MacOS/OpenDeezer
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" OpenDeezer.app
          codesign --verify --strict --verbose=2 OpenDeezer.app

      - name: Zip
        run: cd gui/macos && ditto -c -k --keepParent OpenDeezer.app ../../OpenDeezer-macos-universal.zip

      - name: Notarize and staple
        if: env.SIGN == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          # --wait blocks until Apple returns Accepted/Invalid; a non-Accepted
          # status exits non-zero and fails the (non-blocking) job, so a broken
          # build never uploads.
          xcrun notarytool submit OpenDeezer-macos-universal.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
            --wait
          # Staple the ticket into the .app, then re-zip so the offline ticket ships.
          xcrun stapler staple gui/macos/OpenDeezer.app
          xcrun stapler validate gui/macos/OpenDeezer.app
          rm -f OpenDeezer-macos-universal.zip
          cd gui/macos && ditto -c -k --keepParent OpenDeezer.app ../../OpenDeezer-macos-universal.zip
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-macos-universal.zip

  # ---- GNOME GUI (GTK4 / libadwaita) — needs ubuntu-24.04 (libadwaita >= 1.5) ----
  gnome:
    needs: detect
    if: needs.detect.outputs.gnome == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libjson-glib-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libasound2-dev meson ninja-build gettext
      - name: Build
        run: cd gui/gnome && chmod +x build.sh && ./build.sh
      - name: Stage artifact
        run: cp gui/gnome/opendeezer-gnome OpenDeezer-gnome-${{ matrix.arch }}
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-gnome-${{ matrix.arch }}

  # ---- KDE GUI (Qt6 Widgets) ----
  kde:
    needs: detect
    if: needs.detect.outputs.kde == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-webengine-dev qt6-l10n-tools qt6-tools-dev cmake libasound2-dev
      - name: Build
        run: cd gui/kde && chmod +x build.sh && ./build.sh
      - name: Stage artifact
        run: cp gui/kde/opendeezer-kde OpenDeezer-kde-${{ matrix.arch }}
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-kde-${{ matrix.arch }}

  # ---- Unified Linux client (GTK + Qt backends behind a dlopen launcher) ----
  linux-unified:
    needs: detect
    if: needs.detect.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libjson-glib-dev libwebkitgtk-6.0-dev libsoup-3.0-dev qt6-base-dev qt6-webengine-dev qt6-l10n-tools qt6-tools-dev libasound2-dev meson ninja-build cmake gettext
      - name: Build unified bundle
        run: cd gui/linux && chmod +x build.sh && ./build.sh
      - name: Package
        run: tar -C gui/linux/dist -czf OpenDeezer-linux-${{ matrix.arch }}.tar.gz .
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-linux-${{ matrix.arch }}.tar.gz

  # ---- Windows GUI (C# WinUI 3 / .NET 8) — needs .NET SDK + MinGW (Go DLL) ----
  windows-gui:
    needs: detect
    if: needs.detect.outputs.windows == 'true'
    runs-on: windows-latest
    # SIGN is 'true' only when the Azure Trusted Signing secrets are present, so
    # forks / secret-less runs still zip an unsigned build exactly as before. When
    # true, OpenDeezer.exe is Authenticode-signed so SmartScreen stops flagging an
    # "unknown publisher". See docs/WINDOWS_SIGNING.md.
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.TRUSTED_SIGNING_ACCOUNT_NAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build (Go c-shared DLL + dotnet publish)
        shell: pwsh
        run: cd gui/windows; ./build.ps1
      - name: Locate publish dir
        id: pub
        shell: pwsh
        # build.ps1 publishes a self-contained win-x64 build (exe + WinAppSDK DLLs +
        # libdeezercore.dll) under bin\...\win-x64\publish. Resolve that dir robustly.
        run: |
          $exe = Get-ChildItem -Path gui/windows/bin -Filter OpenDeezer.exe -Recurse -File |
                 Where-Object { $_.FullName -match '\\publish\\' } | Select-Object -First 1
          if (-not $exe) { throw 'publish dir not found' }
          "dir=$($exe.Directory.FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign OpenDeezer.exe (Azure Trusted Signing)
        if: env.SIGN == 'true'
        # Signs only the launcher exe (SmartScreen assesses the exe the user runs;
        # the WinAppSDK DLLs are already Microsoft-signed and libdeezercore.dll is
        # loaded by the signed exe, so re-signing every DLL is unnecessary).
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: ${{ steps.pub.outputs.dir }}
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path (Join-Path '${{ steps.pub.outputs.dir }}' '*') -DestinationPath OpenDeezer-windows-x64.zip
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-windows-x64.zip

  # ---- Android app (Kotlin/Compose via gomobile AAR) ----
  android:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # ANDROID_SIGN is 'true' when a release keystore secret is present: the job
    # then builds release-signed APKs. Without it, it falls back to the debug
    # build (unchanged) so the release still ships installable APKs.
    env:
      ANDROID_SIGN: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
      - name: Build odmobile.aar (gomobile)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          go get golang.org/x/mobile/bind@latest
          gomobile init
          mkdir -p gui/android/app/libs
          gomobile bind -target=android -androidapi 24 -o gui/android/app/libs/odmobile.aar ./mobile
      # ---- signed release build (when the keystore secret is set) ----
      - name: Assemble release APKs (signed, phone + TV)
        if: env.ANDROID_SIGN == 'true'
        working-directory: gui/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/opendeezer-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod +x ./gradlew || true
          ./gradlew --no-daemon assembleMobileRelease assembleTvRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
      - name: Stage release artifacts
        if: env.ANDROID_SIGN == 'true'
        run: |
          cp gui/android/app/build/outputs/apk/mobile/release/*.apk OpenDeezer-android.apk
          cp gui/android/app/build/outputs/apk/tv/release/*.apk OpenDeezer-androidtv.apk

      # ---- debug fallback (no release keystore secret) ----
      - name: Install stable signing keystore (optional)
        if: env.ANDROID_SIGN != 'true'
        # Without a release keystore, Gradle debug-signs with the runner's
        # auto-generated ~/.android/debug.keystore, whose key is random per runner
        # — so APKs from different releases carry different signatures and Android
        # refuses to upgrade (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Set
        # ANDROID_DEBUG_KEYSTORE_BASE64 to a base64 keystore with the standard
        # debug credentials so every release signs with the same key. Generate once:
        #   keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
        #     -storepass android -keypass android -keyalg RSA -keysize 2048 \
        #     -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        #   base64 -w0 debug.keystore   # -> secret value
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Installed persistent debug keystore from secret."
          else
            echo "::warning::No release keystore (ANDROID_KEYSTORE_BASE64) and no ANDROID_DEBUG_KEYSTORE_BASE64 — APKs get an ephemeral per-run key; upgrades across releases will fail."
          fi
      - name: Assemble debug APKs (phone + TV)
        if: env.ANDROID_SIGN != 'true'
        working-directory: gui/android
        run: |
          chmod +x ./gradlew || true
          ./gradlew --no-daemon assembleMobileDebug assembleTvDebug
      - name: Stage debug artifacts
        if: env.ANDROID_SIGN != 'true'
        run: |
          cp gui/android/app/build/outputs/apk/mobile/debug/*.apk OpenDeezer-android.apk
          cp gui/android/app/build/outputs/apk/tv/debug/*.apk OpenDeezer-androidtv.apk

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenDeezer-android.apk
            OpenDeezer-androidtv.apk

  # ---- iOS app (SwiftUI via gomobile xcframework) — unsigned .ipa for sideloading ----
  # No Apple Developer account, so we ship an UNSIGNED device build: sideload with
  # AltStore / Sideloadly (they re-sign with your own Apple ID), or open the Xcode
  # project, set a Team, and run. Non-blocking: hosted-runner iOS toolchains vary.
  ios:
    if: startsWith(github.ref, 'refs/tags/')
    # Liquid Glass (glassEffect / .glassProminent / tabViewBottomAccessory) needs
    # the iOS 26 SDK, so build with Xcode 26 on the macos-26 image (same as the
    # macOS app job). macos-15/Xcode 16 = iOS 18 SDK = compile errors.
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Install the iOS platform for this Xcode
        # macos-26 ships Xcode 26 without the iOS platform support files, so
        # even a device build ('generic/platform=iOS') fails with
        # "iOS 26.0 is not installed". Fetch it first (idempotent, cached image
        # may already have it).
        run: xcodebuild -downloadPlatform iOS || sudo xcodebuild -downloadPlatform iOS
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Build Odmobile.xcframework (gomobile bind ios)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          go get golang.org/x/mobile/bind@latest
          gomobile init
          gomobile bind -target=ios -o gui/ios/Odmobile.xcframework ./mobile
      - name: Generate Xcode project (xcodegen)
        run: |
          brew install xcodegen
          cd gui/ios && xcodegen generate
      - name: Build unsigned device app
        run: |
          cd gui/ios
          # Use an explicit generic iOS destination — '-sdk iphoneos' alone
          # intermittently fails with "Found no destinations for the scheme".
          xcodebuild -project OpenDeezer.xcodeproj -scheme OpenDeezer \
            -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned .ipa
        run: |
          cd gui/ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OpenDeezer.app Payload/
          zip -qry ../../OpenDeezer-ios-unsigned.ipa Payload
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenDeezer-ios-unsigned.ipa

  # ---- Checksums: gather every released asset and publish SHA256SUMS.txt ----
  checksums:
    needs: [tui, macos-app, gnome, kde, linux-unified, windows-gui, android, ios]
    if: startsWith(github.ref, 'refs/tags/') && always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist && cd dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" || true
      - name: Generate SHA256SUMS
        run: |
          # On re-runs the download above includes the previously published
          # SHA256SUMS.txt — drop it so the sums file never references itself.
          rm -f dist/SHA256SUMS.txt
          cd dist && sha256sum * > ../SHA256SUMS.txt || true
          cat ../SHA256SUMS.txt || true
      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
