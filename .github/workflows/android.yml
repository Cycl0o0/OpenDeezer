name: android

on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - "internal/**"
      - "gui/android/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-mobile-tools.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "internal/**"
      - "gui/android/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-mobile-tools.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build android (aar + apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          # Default is "tools platform-tools"; "tools" drags in an Android
          # Emulator update (~300 MB) we never use and whose download flakes.
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"

      - name: Build odmobile.aar (gomobile)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          scripts/build-mobile-tools.sh "$RUNNER_TEMP/opendeezer-mobile-tools"
          export PATH="$RUNNER_TEMP/opendeezer-mobile-tools:$PATH"
          mkdir -p gui/android/app/libs
          gomobile bind -trimpath -target=android -androidapi 24 \
            -o gui/android/app/libs/odmobile.aar ./mobile

      - name: Assemble debug APKs (phone + TV flavors)
        working-directory: gui/android
        run: |
          chmod +x ./gradlew || true
          ./gradlew --no-daemon assembleMobileDebug assembleTvDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: opendeezer-android-debug
          path: gui/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn
