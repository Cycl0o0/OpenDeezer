<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OpenDeezer Remote</title>
<style>
:root {
  --accent: #A238FF;
  --accent-dim: #7a1fd4;
  --bg: #0e0e0e;
  --surface: #1c1c1e;
  --surface2: #2c2c2e;
  --text: #ffffff;
  --text-muted: #8e8e93;
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 16px;
  overscroll-behavior: none;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  padding: 1.5rem 1.5rem calc(1.5rem + var(--safe-bottom));
}

/* ---- Pair view ---- */
#pair-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
  width: 100%;
  max-width: 320px;
  text-align: center;
}
.logo {
  font-size: 2rem;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -1px;
}
.logo span { color: var(--text); font-weight: 300; }
#pair-view p {
  color: var(--text-muted);
  font-size: 0.95rem;
  line-height: 1.5;
}
#code-input {
  width: 100%;
  padding: 1rem;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.5rem;
  text-align: center;
  background: var(--surface);
  border: 2px solid var(--surface2);
  border-radius: var(--radius);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
#code-input:focus { border-color: var(--accent); }
#pair-btn {
  width: 100%;
  padding: 1rem;
  font-size: 1.05rem;
  font-weight: 600;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
#pair-btn:active { background: var(--accent-dim); }
#pair-error {
  color: #ff6b6b;
  font-size: 0.9rem;
  min-height: 1.2em;
}

/* ---- Controls view ---- */
#ctrl-view {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 1.1rem;
  width: 100%;
  max-width: 380px;
}

/* Artwork */
#artwork-wrap {
  width: 200px;
  height: 200px;
  border-radius: 12px;
  background: var(--surface);
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
#artwork {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.artwork-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3.5rem;
  color: var(--text-muted);
}

/* Track info */
.track-info {
  width: 100%;
  text-align: center;
  overflow: hidden;
}
#track-title {
  font-size: 1.1rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.25rem;
}
#track-artist {
  font-size: 0.9rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Progress */
.progress-section {
  width: 100%;
}
#progress-bar-wrap {
  width: 100%;
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  margin-bottom: 0.4rem;
}
#progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  width: 0%;
  pointer-events: none;
  transition: width 0.2s linear;
}
.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* Transport */
.transport {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  width: 100%;
}
.transport button {
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  padding: 0.5rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
  -webkit-touch-callout: none;
  user-select: none;
}
.transport button:active { opacity: 0.5; }
.btn-sm { font-size: 1.4rem; }
.btn-lg {
  font-size: 2.2rem;
  background: var(--surface) !important;
  width: 68px;
  height: 68px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
#playpause-btn { color: var(--accent); }

/* Volume */
.volume-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.vol-icon { font-size: 1.1rem; color: var(--text-muted); flex-shrink: 0; }
#volume-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(to right, var(--accent) var(--pct, 80%), var(--surface2) var(--pct, 80%));
  outline: none;
  cursor: pointer;
}
#volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text);
  cursor: pointer;
}
#volume-slider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text);
  border: none;
  cursor: pointer;
}

/* Extra controls */
.extra-controls {
  display: flex;
  gap: 0.75rem;
  width: 100%;
  justify-content: center;
}
.ctrl-btn {
  flex: 1;
  max-width: 140px;
  padding: 0.65rem 0.5rem;
  font-size: 0.8rem;
  font-weight: 600;
  background: var(--surface);
  color: var(--text-muted);
  border: 2px solid var(--surface2);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  transition: color 0.15s, border-color 0.15s;
  -webkit-touch-callout: none;
  user-select: none;
}
.ctrl-btn:active { opacity: 0.6; }
.ctrl-btn.active {
  color: var(--accent);
  border-color: var(--accent);
}

/* ---- Equalizer panel ---- */
#eq-panel {
  display: none;
  flex-direction: column;
  gap: 0.9rem;
  width: 100%;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1rem;
}
.eq-toggle-row {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
}
#eq-preset {
  width: 100%;
  padding: 0.6rem 0.75rem;
  font-size: 0.9rem;
  font-weight: 600;
  background: var(--surface2);
  color: var(--text);
  border: 2px solid var(--surface2);
  border-radius: 10px;
  outline: none;
  cursor: pointer;
}
#eq-preset:focus { border-color: var(--accent); }
#eq-bands {
  display: flex;
  width: 100%;
}
.eq-band {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}
.eq-slider-wrap {
  position: relative;
  width: 100%;
  height: 110px;
}
.eq-slider {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 110px;
  height: 4px;
  transform: translate(-50%, -50%) rotate(-90deg);
  -webkit-appearance: none;
  appearance: none;
  border-radius: 2px;
  background: var(--surface2);
  outline: none;
  cursor: pointer;
}
.eq-band-label {
  font-size: 0.6rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.eq-preamp-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.eq-preamp-row label {
  font-size: 0.75rem;
  color: var(--text-muted);
  flex-shrink: 0;
}
#eq-preamp-val {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  min-width: 3.5em;
  text-align: right;
  flex-shrink: 0;
}
#eq-preamp {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--surface2);
  outline: none;
  cursor: pointer;
}
.eq-slider::-webkit-slider-thumb, #eq-preamp::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text);
  cursor: pointer;
}
.eq-slider::-moz-range-thumb, #eq-preamp::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text);
  border: none;
  cursor: pointer;
}
#eq-error {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-align: center;
}
#eq-error:empty { display: none; }

/* State badge */
#state-badge {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
</style>
</head>
<body>

<!-- Pairing view -->
<div id="pair-view">
  <div class="logo">Open<span>Deezer</span></div>
  <p>Enter the 6-digit code shown on your device to pair your phone as a remote.</p>
  <input id="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
  <button id="pair-btn">Pair</button>
  <div id="pair-error"></div>
</div>

<!-- Controls view -->
<div id="ctrl-view">
  <div id="artwork-wrap">
    <div class="artwork-placeholder" id="artwork-placeholder">&#9834;</div>
    <img id="artwork" src="" alt="" style="display:none" onerror="this.style.display='none';document.getElementById('artwork-placeholder').style.display='flex'">
  </div>

  <div class="track-info">
    <div id="track-title">Not playing</div>
    <div id="track-artist"></div>
  </div>

  <div class="progress-section">
    <div id="progress-bar-wrap">
      <div id="progress-fill"></div>
    </div>
    <div class="time-row">
      <span id="time-pos">0:00</span>
      <span id="time-dur">0:00</span>
    </div>
  </div>

  <div class="transport">
    <button id="prev-btn" class="btn-sm" title="Previous">&#9664;&#9664;</button>
    <button id="playpause-btn" class="btn-lg" title="Play / Pause">&#9654;</button>
    <button id="next-btn" class="btn-sm" title="Next">&#9654;&#9654;</button>
  </div>

  <div class="volume-row">
    <span class="vol-icon">&#128266;</span>
    <input id="volume-slider" type="range" min="0" max="100" value="80">
    <span class="vol-icon">&#128266;</span>
  </div>

  <div class="extra-controls">
    <button id="repeat-btn" class="ctrl-btn" title="Repeat">&#8635; Repeat: off</button>
    <button id="shuffle-btn" class="ctrl-btn" title="Shuffle">&#8652; Shuffle</button>
    <button id="sleep-btn" class="ctrl-btn" title="Sleep timer">&#9790; Sleep</button>
  </div>

  <div class="extra-controls">
    <button id="eq-btn" class="ctrl-btn" title="Equalizer">&#9776; Equalizer</button>
  </div>

  <div id="eq-panel">
    <div class="eq-toggle-row">
      <button id="eq-enable-btn" class="ctrl-btn">EQ: off</button>
      <button id="eq-mono-btn" class="ctrl-btn">Mono: off</button>
    </div>
    <select id="eq-preset" title="Preset"></select>
    <div id="eq-bands"></div>
    <div class="eq-preamp-row">
      <label for="eq-preamp">Preamp</label>
      <input id="eq-preamp" type="range" min="-12" max="12" step="0.5" value="0">
      <span id="eq-preamp-val">0 dB</span>
    </div>
    <div id="eq-error"></div>
  </div>

  <div id="state-badge"></div>
</div>

var LANG = (navigator.language || navigator.userLanguage || 'en').slice(0, 2).toLowerCase();
if (!I18N[LANG]) LANG = 'en';
function t(k) { return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; }
function tf(k) {
  var s = t(k);
  for (var i = 1; i < arguments.length; i++) s = s.replace('{n}', arguments[i]);
  return s;
}
function stateLabel(s) { return t('st_' + s) !== 'st_' + s ? t('st_' + s) : s; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ---- State ----
var token = localStorage.getItem(SESSION_KEY);
var currentState = {};
var pollTimer = null;
var volumeActive = false; // don't update slider while user is dragging

// ---- Elements ----
var pairView    = document.getElementById('pair-view');
var ctrlView    = document.getElementById('ctrl-view');
var codeInput   = document.getElementById('code-input');
var pairBtn     = document.getElementById('pair-btn');
var pairError   = document.getElementById('pair-error');
var artworkImg  = document.getElementById('artwork');
var artworkPlh  = document.getElementById('artwork-placeholder');
var trackTitle  = document.getElementById('track-title');
var trackArtist = document.getElementById('track-artist');
var progressFill= document.getElementById('progress-fill');
var progressWrap= document.getElementById('progress-bar-wrap');
var timePos     = document.getElementById('time-pos');
var timeDur     = document.getElementById('time-dur');
var playpauseBtn= document.getElementById('playpause-btn');
var prevBtn     = document.getElementById('prev-btn');
var nextBtn     = document.getElementById('next-btn');
var volSlider   = document.getElementById('volume-slider');
var repeatBtn   = document.getElementById('repeat-btn');
var shuffleBtn  = document.getElementById('shuffle-btn');
var sleepBtn    = document.getElementById('sleep-btn');
var stateBadge  = document.getElementById('state-badge');
var eqBtn       = document.getElementById('eq-btn');
var eqPanel     = document.getElementById('eq-panel');
var eqEnableBtn = document.getElementById('eq-enable-btn');
var eqMonoBtn   = document.getElementById('eq-mono-btn');
var eqPreset    = document.getElementById('eq-preset');
var eqBands     = document.getElementById('eq-bands');
var eqPreamp    = document.getElementById('eq-preamp');
var eqPreampVal = document.getElementById('eq-preamp-val');
var eqError     = document.getElementById('eq-error');

// ---- View switching ----
function showPair() {
  pairView.style.display = 'flex';
  ctrlView.style.display = 'none';
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function showControls() {
  pairView.style.display = 'none';
  ctrlView.style.display = 'flex';
  startPolling();
}

// ---- Pairing ----
function setPairError(msg) { pairError.textContent = msg; }

pairBtn.addEventListener('click', doPair);
codeInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doPair();
});

function doPair() {
  var code = codeInput.value.trim();
  if (code.length === 0) { setPairError(t('enterCode')); return; }
  setPairError('');
  pairBtn.disabled = true;
  pairBtn.textContent = t('pairing');

  fetch('/pair', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code })
  }).then(function(r) {
    if (r.status === 429) {
      setPairError(t('tooMany'));
      pairBtn.disabled = false;
      pairBtn.textContent = t('pair');
      return null;
    }
    if (r.status === 401 || r.status === 404) {
      setPairError(t('invalidCode'));
      pairBtn.disabled = false;
      pairBtn.textContent = t('pair');
      return null;
    }
    if (!r.ok) {
      setPairError(tf('errorRetry', r.status));
      pairBtn.disabled = false;
      pairBtn.textContent = t('pair');
      return null;
    }
    return r.json();
  }).then(function(data) {
    if (!data) return;
    token = data.token;
    localStorage.setItem(SESSION_KEY, token);
    pairBtn.disabled = false;
    pairBtn.textContent = t('pair');
    codeInput.value = '';
    showControls();
  }).catch(function() {
    setPairError(t('networkErr'));
    pairBtn.disabled = false;
    pairBtn.textContent = t('pair');
  });
}

// ---- API helpers ----
function api(method, path) {
  return fetch(path, {
    method: method,
    headers: { 'X-OpenDeezer-Session': token }
  }).then(function(r) {
    if (r.status === 401) {
      localStorage.removeItem(SESSION_KEY);
      token = null;
      showPair();
      setPairError(t('sessionExpired'));
      return Promise.reject(new Error('unauthorized'));
    }
    if (!r.ok) return Promise.reject(new Error('http ' + r.status));
    return r.json();
  });
}

// ---- Polling ----
function startPolling() {
  poll();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 1000);
}

function poll() {
  api('GET', '/status').then(applyState).catch(function() {});
}

// ---- UI update ----
function fmtTime(ms) {
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  s = s % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function applyState(st) {
  currentState = st;

  // Track info (local var must NOT shadow the module-level translator t())
  var tr = st.track;
  if (tr && tr.title) {
    trackTitle.textContent  = tr.title;
    trackArtist.textContent = tr.artist || '';
    if (tr.artworkUrl) {
      artworkImg.src = tr.artworkUrl;
      artworkImg.style.display = 'block';
      artworkPlh.style.display = 'none';
    } else {
      artworkImg.style.display = 'none';
      artworkPlh.style.display = 'flex';
    }
  } else {
    trackTitle.textContent  = t('notPlaying');
    trackArtist.textContent = '';
    artworkImg.style.display = 'none';
    artworkPlh.style.display = 'flex';
  }

  // Progress
  var pos = st.positionMs || 0;
  var dur = st.durationMs || (tr && tr.durationMs) || 0;
  if (dur > 0) {
    progressFill.style.width = Math.min(100, (pos / dur) * 100) + '%';
    timePos.textContent = fmtTime(pos);
    timeDur.textContent = fmtTime(dur);
  } else {
    progressFill.style.width = '0%';
    timePos.textContent = '0:00';
    timeDur.textContent = '0:00';
  }

  // Play/pause button
  if (st.state === 'playing') {
    playpauseBtn.innerHTML = '&#9646;&#9646;'; // pause icon
  } else {
    playpauseBtn.innerHTML = '&#9654;'; // play icon
  }

  // State badge
  stateBadge.textContent = st.state ? stateLabel(st.state) : '';

  // Volume (don't update while user is dragging)
  if (!volumeActive) {
    var vPct = Math.round((st.volume || 0) * 100);
    volSlider.value = vPct;
    volSlider.style.setProperty('--pct', vPct + '%');
  }

  // Repeat button
  var rep = st.repeat || 'off';
  repeatBtn.className = 'ctrl-btn' + (rep !== 'off' ? ' active' : '');
  repeatBtn.innerHTML = '&#8635; ' + esc((rep === 'one') ? t('repeatOne') : (rep === 'all' ? t('repeatAll') : t('repeatOff')));

  // Shuffle button
  shuffleBtn.className = 'ctrl-btn' + (st.shuffle ? ' active' : '');
  shuffleBtn.innerHTML = '&#8652; ' + esc(st.shuffle ? t('shuffleOn') : t('shuffle'));

  // Sleep-timer button
  sleepBtn.className = 'ctrl-btn' + (st.sleepActive ? ' active' : '');
  if (st.sleepActive && st.sleepEndOfTrack) {
    sleepBtn.innerHTML = '&#9790; ' + esc(t('sleepEnd'));
  } else if (st.sleepActive) {
    var mins = Math.max(1, Math.round((st.sleepRemainingMs || 0) / 60000));
    sleepBtn.innerHTML = '&#9790; ' + esc(tf('sleepMin', mins));
  } else {
    sleepBtn.innerHTML = '&#9790; ' + esc(t('sleep'));
  }
}

// ---- Transport controls ----
playpauseBtn.addEventListener('click', function() {
  api('POST', '/playpause').then(applyState).catch(function() {});
});
prevBtn.addEventListener('click', function() {
  api('POST', '/prev').then(applyState).catch(function() {});
});
nextBtn.addEventListener('click', function() {
  api('POST', '/next').then(applyState).catch(function() {});
});

// ---- Progress bar (seek on tap/click) ----
progressWrap.addEventListener('click', function(e) {
  var rect = progressWrap.getBoundingClientRect();
  var ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  var dur = currentState.durationMs || (currentState.track && currentState.track.durationMs) || 0;
  if (dur <= 0) return;
  var ms = Math.round(ratio * dur);
  api('POST', '/seek?ms=' + ms).then(applyState).catch(function() {});
});

// ---- Volume slider ----
volSlider.addEventListener('input', function() {
  volumeActive = true;
  var pct = parseInt(this.value, 10);
  this.style.setProperty('--pct', pct + '%');
});
volSlider.addEventListener('change', function() {
  var v = parseInt(this.value, 10) / 100;
  api('POST', '/volume?v=' + v.toFixed(4)).then(function(st) {
    applyState(st);
    volumeActive = false;
  }).catch(function() { volumeActive = false; });
});

// ---- Repeat (cycle: off → all → one → off) ----
var repeatCycle = ['off', 'all', 'one'];
repeatBtn.addEventListener('click', function() {
  var cur = currentState.repeat || 'off';
  var next = repeatCycle[(repeatCycle.indexOf(cur) + 1) % repeatCycle.length];
  api('POST', '/repeat?mode=' + next).then(applyState).catch(function() {});
});

// ---- Shuffle toggle ----
shuffleBtn.addEventListener('click', function() {
  var on = currentState.shuffle ? 'false' : 'true';
  api('POST', '/shuffle?on=' + on).then(applyState).catch(function() {});
});

// ---- Sleep timer (cycle: off → 15 → 30 → 45 → 60 min → end-of-track → off) ----
var sleepCycle = [0, 15, 30, 45, 60, -1]; // -1 = end of track
function currentSleepStep() {
  if (!currentState.sleepActive) return 0;
  if (currentState.sleepEndOfTrack) return 5;
  var mins = Math.round((currentState.sleepRemainingMs || 0) / 60000);
  var closest = 1, best = 1e9;
  for (var i = 1; i <= 4; i++) {
    var d = Math.abs(sleepCycle[i] - mins);
    if (d < best) { best = d; closest = i; }
  }
  return closest;
}
sleepBtn.addEventListener('click', function() {
  var next = (currentSleepStep() + 1) % sleepCycle.length;
  var v = sleepCycle[next];
  var path = (v === 0) ? '/sleep?cancel=1'
    : (v < 0 ? '/sleep?eot=1' : '/sleep?minutes=' + v);
  api('POST', path).then(applyState).catch(function() {});
});

// ---- Equalizer ----
// State lives in the engine (GET/POST /eq); this panel only renders it. It is
// re-read every time the panel opens so changes from other clients show up.
var eqState        = null; // last snapshot from the server
var eqSliders      = [];   // the 10 band inputs, built from the first snapshot
var eqDragBand     = -1;   // band being dragged (don't overwrite it from polls)
var eqSendTimer    = null; // coalesces drag events to <=30 calls/s
var eqPendingBands = {};

function fmtBandHz(hz) {
  return hz >= 1000 ? (hz / 1000) + 'k' : Math.round(hz) + '';
}

function buildEQBands(bands) {
  eqBands.innerHTML = '';
  eqSliders = [];
  bands.forEach(function(hz, i) {
    var col  = document.createElement('div');
    col.className = 'eq-band';
    var wrap = document.createElement('div');
    wrap.className = 'eq-slider-wrap';
    var s = document.createElement('input');
    s.type = 'range';
    s.className = 'eq-slider';
    s.min = -12; s.max = 12; s.step = 0.5; s.value = 0;
    s.addEventListener('input',  function() { onBandInput(i, parseFloat(s.value)); });
    s.addEventListener('change', function() { onBandChange(i, parseFloat(s.value)); });
    wrap.appendChild(s);
    var lbl = document.createElement('div');
    lbl.className = 'eq-band-label';
    lbl.textContent = fmtBandHz(hz);
    col.appendChild(wrap);
    col.appendChild(lbl);
    eqBands.appendChild(col);
    eqSliders.push(s);
  });
}

function buildEQPresets(presets) {
  eqPreset.innerHTML = '';
  presets.forEach(function(name) {
    var o = document.createElement('option');
    o.value = name;
    o.textContent = name.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
    eqPreset.appendChild(o);
  });
  // "custom" is shown when a band was hand-edited but is not user-selectable.
  var custom = document.createElement('option');
  custom.value = 'custom';
  custom.textContent = t('custom');
  custom.disabled = true;
  eqPreset.appendChild(custom);
}

function applyEQ(eq) {
  eqState = eq;
  eqError.textContent = '';
  if (eqSliders.length === 0 && eq.bands) buildEQBands(eq.bands);
  if (eqPreset.options.length === 0 && eq.presets) buildEQPresets(eq.presets);
  eqEnableBtn.className = 'ctrl-btn' + (eq.enabled ? ' active' : '');
  eqEnableBtn.textContent = eq.enabled ? t('eqOn') : t('eqOff');
  eqMonoBtn.className = 'ctrl-btn' + (eq.mono ? ' active' : '');
  eqMonoBtn.textContent = eq.mono ? t('monoOn') : t('monoOff');
  eqPreset.value = eq.preset || 'flat';
  (eq.gainsDb || []).forEach(function(db, i) {
    if (i !== eqDragBand && eqSliders[i]) eqSliders[i].value = db;
  });
  var pre = eq.preampDb || 0;
  eqPreamp.value = pre;
  eqPreampVal.textContent = (pre > 0 ? '+' : '') + pre + ' dB';
}

function refreshEQ() {
  api('GET', '/eq').then(applyEQ).catch(function() {
    eqError.textContent = t('eqUnavailable');
  });
}

eqBtn.addEventListener('click', function() {
  var open = eqPanel.style.display === 'flex';
  eqPanel.style.display = open ? 'none' : 'flex';
  eqBtn.className = 'ctrl-btn' + (open ? '' : ' active');
  if (!open) refreshEQ();
});

eqEnableBtn.addEventListener('click', function() {
  var on = (eqState && eqState.enabled) ? '0' : '1';
  api('POST', '/eq?on=' + on).then(applyEQ).catch(function() {});
});

eqMonoBtn.addEventListener('click', function() {
  var on = (eqState && eqState.mono) ? '0' : '1';
  api('POST', '/eq?mono=' + on).then(applyEQ).catch(function() {});
});

eqPreset.addEventListener('change', function() {
  api('POST', '/eq?preset=' + encodeURIComponent(this.value)).then(applyEQ).catch(function() {});
});

// Band drags: show "Custom" immediately, coalesce sends to <=30/s. The engine
// debounces persistence itself; this only caps HTTP chatter during a drag.
function onBandInput(i, db) {
  eqDragBand = i;
  eqPreset.value = 'custom';
  eqPendingBands[i] = db;
  if (!eqSendTimer) eqSendTimer = setTimeout(flushEQBands, 33);
}

function flushEQBands() {
  eqSendTimer = null;
  var pend = eqPendingBands;
  eqPendingBands = {};
  Object.keys(pend).forEach(function(i) {
    api('POST', '/eq?band=' + i + '&db=' + pend[i]).catch(function() {});
  });
}

function onBandChange(i, db) {
  eqDragBand = -1;
  delete eqPendingBands[i]; // the final value goes out right away
  api('POST', '/eq?band=' + i + '&db=' + db).then(applyEQ).catch(function() {});
}

eqPreamp.addEventListener('input', function() {
  var v = parseFloat(this.value);
  eqPreampVal.textContent = (v > 0 ? '+' : '') + v + ' dB';
});
eqPreamp.addEventListener('change', function() {
  api('POST', '/eq?preamp=' + this.value).then(applyEQ).catch(function() {});
});

// ---- Static i18n ----
// Localizes the fixed markup once on load (dynamic text is handled inline via t()
// as state arrives). Arabic switches the whole document to RTL.
function applyStaticI18n() {
  document.documentElement.lang = LANG;
  if (LANG === 'ar') document.documentElement.dir = 'rtl';
  var intro = pairView.querySelector('p');
  if (intro) intro.textContent = t('pairIntro');
  pairBtn.textContent = t('pair');
  prevBtn.title = t('prev');
  playpauseBtn.title = t('playPause');
  nextBtn.title = t('next');
  trackTitle.textContent = t('notPlaying');
  repeatBtn.innerHTML = '&#8635; ' + esc(t('repeatOff'));
  shuffleBtn.innerHTML = '&#8652; ' + esc(t('shuffle'));
  sleepBtn.innerHTML = '&#9790; ' + esc(t('sleep'));
  eqBtn.innerHTML = '&#9776; ' + esc(t('equalizer'));
  eqEnableBtn.textContent = t('eqOff');
  eqMonoBtn.textContent = t('monoOff');
  eqPreset.title = t('preset');
  var preampLabel = document.querySelector('.eq-preamp-row label');
  if (preampLabel) preampLabel.textContent = t('preamp');
}

// ---- Init ----
applyStaticI18n();
if (token) {
  showControls();
} else {
  showPair();
}

})();
</script>
</body>
</html>
